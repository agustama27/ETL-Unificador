# Desarrollo local: monta el codigo y levanta vite con hot reload.
# El stack de despliegue es compose.yaml.
#   docker compose -f docker-compose.dev.yml --profile dev up
services:
  api:
    build:
      context: .
      dockerfile: apps/etl-platform-api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      # Compose es la vía de desarrollo: sin token la API queda abierta acá.
      # En cualquier otro despliegue, sin ETL_CONSOLE_TOKEN la API es fail-closed.
      ETL_CONSOLE_TOKEN: ${ETL_CONSOLE_TOKEN:-}
      ETL_AUTH_DISABLED: ${ETL_AUTH_DISABLED:-1}
    volumes:
      - ./var:/app/var

  # Sólo para desarrollo: docker compose --profile dev up
  frontend:
    profiles: [dev]
    image: node:20-alpine
    working_dir: /app
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
    volumes:
      - ./apps/etl-console:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    depends_on:
      - api

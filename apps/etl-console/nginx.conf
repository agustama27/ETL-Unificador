server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # La consola sube bases de clientes: el default de 1 MB de nginx las rechaza
    # con un 413 que en el navegador se ve como "error de red".
    client_max_body_size 512m;

    # El backend NO publica puerto al host: se llega por la red interna de Compose.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Un ETL puede tardar hasta una hora. Los defaults de 60s cortarian la
        # descarga de artefactos de una corrida larga a la mitad.
        proxy_connect_timeout 30s;
        proxy_send_timeout    3900s;
        proxy_read_timeout    3900s;
        proxy_buffering       off;
    }

    # Sondas del backend, para diagnosticar desde el mismo puerto publicado.
    location = /health { proxy_pass http://backend:8000/health; }
    location = /ready  { proxy_pass http://backend:8000/ready; }

    # SPA: cualquier ruta que no sea un archivo cae en index.html y la resuelve
    # react-router. Sin esto, un F5 en /historial devuelve 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

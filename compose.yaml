# Stack de despliegue en la VM compartida SRV-APP-STAGE.
#
# Solo el frontend publica un puerto al host. El backend queda en la red interna:
# nginx le proxea /api. El puerto del host se define en .env (ETL_HOST_PORT), y se
# elige tras inspeccionar la VM — nunca a ojo, porque la VM es compartida.
#
# Para desarrollo local usar docker-compose.dev.yml, que monta el codigo y levanta vite.

name: etl-unificador

services:
  backend:
    build:
      context: .
      dockerfile: apps/etl-platform-api/Dockerfile
    env_file: .env
    environment:
      # La zona horaria es funcional: los wrappers de etls/ nombran su salida con
      # la fecha local y los manifiestos la buscan por glob. Un contenedor en UTC
      # a las 21:00 de Argentina escribe la fecha de manana.
      TZ: ${TZ:-America/Argentina/Buenos_Aires}
    expose:
      - "8000"
    volumes:
      # var/ guarda index.sqlite, la evidencia forense de cada corrida, el estado
      # promovido y los uploads. Sin volumen se pierde en cada recreacion.
      - etl-var:/app/var
    restart: unless-stopped
    healthcheck:
      # /ready falla si el catalogo no carga o var/ no es escribible, que es el
      # sintoma exacto de un volumen mal montado.
      test: ["CMD", "python", "-c",
             "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://localhost:8000/ready',timeout=5).status==200 else 1)"]
      interval: 15s
      timeout: 10s
      retries: 5
      # El arranque reconstruye el indice y recupera corridas huerfanas.
      start_period: 90s

  frontend:
    build:
      context: ./apps/etl-console
      dockerfile: Dockerfile
    ports:
      - "${ETL_HOST_PORT:?definir ETL_HOST_PORT en .env tras inspeccionar la VM}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  etl-var:

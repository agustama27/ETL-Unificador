sonar.projectKey=etl-unificador
sonar.projectName=etl-unificador
sonar.projectVersion=1.0

# Community Edition solo soporta analisis de la rama principal.
sonar.sources=apps,tools
sonar.tests=tests
sonar.test.inclusions=tests/**/*.py

# Los legacy vendorizados son codigo de terceros bajo control del cliente: no se
# analizan ni se les mide cobertura. Modificarlos exige OK de operaciones y UAT byte
# a byte (AGENTS.md, regla dura 1), asi que un hallazgo de Sonar ahi no es accionable.
sonar.exclusions=**/legacy/**,**/legacy_base/**,**/__pycache__/**,**/*.pyc,**/coverage_html/**,**/.venv/**,**/uv.lock,var/**,apps/etl-console/**

sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml

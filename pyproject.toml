[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "etl-unificador"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6.0,<7.0"]

[project.optional-dependencies]
test = ["pytest>=8.4,<9.0", "httpx>=0.27,<1.0"]
etl = [
    "pandas>=2.2,<3.0",
    "openpyxl>=3.1,<4.0",
    "email-validator>=2.0,<3.0",
]
naranjax = ["etl-unificador[etl]"]
api = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "python-multipart>=0.0.9,<0.1",
]

[tool.setuptools.packages.find]
include = ["etl_core*", "orchestrator*", "adapters*", "platform_api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "etl-unificador"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6.0,<7.0"]

[project.optional-dependencies]
test = ["pytest>=8.4,<9.0"]
naranjax = ["pandas>=2.2,<3.0", "openpyxl>=3.1,<4.0"]

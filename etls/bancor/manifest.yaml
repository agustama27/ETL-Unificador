schema_version: 1
etls:
  - id: bancor.base.daily
    name: Bancor - Base de llamadas (back-base)
    repository_status: present
    readiness: ready
    executable: true
    project_path: etls/bancor/legacy
    working_dir: etls/bancor/legacy
    entrypoint: etls/bancor/job.py
    command: [python, ../job.py]
    fixed_arguments: []
    arguments:
      base: --input
    inputs:
      - {role: base, extensions: [.csv], required: true}
    outputs:
      - {role: base_filtrada, glob: 'con-filtros/base_bancor_*.csv', date_format: DDMMYYYY}
      - {role: telefonos, glob: 'con-filtros/telefonos_x_cliente_*.csv', date_format: DDMMYYYY}
      - {role: roman, glob: 'sin-filtros/BANCOR_ROMAN_*.csv', date_format: YYYYMMDD}
      - {role: e1kia, glob: 'sin-filtros/BANCOR_E1KIA_*_sinestrategia.csv', date_format: YYYYMMDD}
    allowed_exits: [0]
    timeout_seconds: 900
    request_date_format: YYYYMMDD
    output_date_source: system_date
    adapter: etl_core.contracts:SubprocessAdapter
  - id: bancor.resultados.retell
    name: Bancor - Resultados Retell.ai (requiere API y credenciales)
    repository_status: present
    readiness: blocked
    executable: false
    project_path: etls/bancor/legacy
  - id: bancor.carga_masiva
    name: Bancor - Carga masiva CRM (pendiente de diseno)
    repository_status: present
    readiness: candidate
    executable: false
    project_path: etls/bancor/legacy
  - id: bancor.cupones
    name: Bancor - Cupones de pago (legacy en desarrollo)
    repository_status: present
    readiness: blocked
    executable: false
    project_path: etls/bancor/legacy

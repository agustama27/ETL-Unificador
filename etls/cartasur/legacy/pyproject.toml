[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cartasur-etl"
version = "0.1.0"
description = "CartaSur Excel to SOHO dynamic variables CSV ETL"
requires-python = ">=3.11"
dependencies = [
  "holidays>=0.58",
  "pandas>=2.0",
  "openpyxl>=3.1",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
packaging = ["customtkinter>=5.2", "pyinstaller>=6.0"]

[project.scripts]
cartasur-etl = "cartasur_etl.cli:main"
cartasur-etl-app = "cartasur_etl.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cartasur_etl = ["config/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

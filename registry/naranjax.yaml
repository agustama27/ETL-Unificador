schema_version: 1
etls:
  - id: naranjax.ma.chat.daily
    name: Naranja X MA Chat daily
    repository_status: present
    readiness: ready
    executable: true
    project_path: SOHO-Chat-NX_MA-ETL
    working_dir: SOHO-Chat-NX_MA-ETL
    entrypoint: SOHO-Chat-NX_MA-ETL/back-base/ejecutar_dia.py
    command: [python, back-base/ejecutar_dia.py]
    fixed_arguments: [--chat]
    arguments:
      business_date: --fecha
      base: --input
      planes: --planes
      pagos: --pagos
      no_planes_today: --sin_planes_hoy
    inputs:
      - {role: base, extensions: [.xlsx], required: true}
      - {role: planes, extensions: [.xlsx], required: false}
      - {role: pagos, extensions: [.csv], required: false}
    outputs:
      - {role: roman, glob: 'NARANJAX_MA_ROMAN_*.csv', date_format: YYYYMMDD}
      - {role: chat, glob: 'NARANJAX_MA_CHAT_ROMAN_*.csv', date_format: YYMMDD}
      - {role: e1kia, glob: 'NARANJAX_MA_E1KIA_*_sinestrategia.csv', date_format: YYMMDD}
    allowed_exits: [0]
    timeout_seconds: 900
    request_date_format: YYYYMMDD
    output_date_source: system_date
    adapter: naranjax.ma.chat
    environment_allowlist: [NARANJAX_PLANES_MIN_COVERAGE]
  - id: naranjax.ma.voice.daily
    name: Naranja X MA Voice daily
    repository_status: present
    readiness: candidate
    executable: false
    project_path: soho-naranjaX-MA-etl
    working_dir: soho-naranjaX-MA-etl
    entrypoint: soho-naranjaX-MA-etl/back-base/ejecutar_dia.py
    command: [python, back-base/ejecutar_dia.py]
    fixed_arguments: []
    arguments:
      business_date: --fecha
      base: --input
      planes: --planes
      pagos: --pagos
      no_planes_today: --sin-planes-hoy
    inputs:
      - {role: base, extensions: [.xlsx], required: true}
      - {role: planes, extensions: [.xlsx], required: false}
      - {role: pagos, extensions: [.csv], required: false}
    outputs:
      - {role: roman, glob: 'NARANJAX_MA_ROMAN_*.csv', date_format: YYYYMMDD}
      - {role: e1kia, glob: 'NARANJAX_MA_E1KIA_*_sinestrategia.csv', date_format: YYMMDD}
    allowed_exits: [0]
    timeout_seconds: 900
    request_date_format: YYYYMMDD
    output_date_source: system_date
    adapter: naranjax.ma.voice
    environment_allowlist: [NARANJAX_PLANES_MIN_COVERAGE]
  - id: naranjax.ma.voice.pct
    name: Naranja X MA Voice PCT
    repository_status: present
    readiness: blocked
    executable: false
    project_path: soho-naranjaX-MA-etl
  - id: naranjax.mt.voice.daily
    name: Naranja X MT Voice daily
    repository_status: present
    readiness: blocked
    executable: false
    project_path: soho-naranjaX-MT-etl

schema_version: 1
etls:
  - id: petersen.gestiones.daily
    name: Petersen - Gestiones AG002 (ROMAN)
    repository_status: present
    readiness: ready
    executable: true
    project_path: soho-petersen-cobranzas-resultados
    working_dir: soho-petersen-cobranzas-resultados
    entrypoint: adapters/petersen/gestiones_job.py
    command: [python, ../adapters/petersen/gestiones_job.py]
    fixed_arguments: []
    arguments:
      base: --input
      approach: --approach
      clientes: --clientes
      excluidos: --excluidos
    inputs:
      - {role: base, extensions: [.csv], required: true}
      - {role: approach, extensions: [.csv], required: false}
      - {role: clientes, extensions: [.csv], required: false}
      - {role: excluidos, extensions: [.csv], required: false}
    outputs:
      - {role: gestiones, glob: 'Gestiones_Petersen_*.zip', date_format: YYYYMMDD}
    allowed_exits: [0]
    timeout_seconds: 900
    request_date_format: YYYYMMDD
    output_date_source: system_date
    adapter: adapters.petersen.gestiones:PetersenGestionesAdapter
  - id: petersen.retell
    name: Petersen - Enriquecimiento Retell.ai (requiere API y credenciales)
    repository_status: present
    readiness: blocked
    executable: false
    project_path: soho-petersen-cobranzas-resultados

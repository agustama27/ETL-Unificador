services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./var:/app/var

  # Sólo para desarrollo: docker compose --profile dev up
  frontend:
    profiles: [dev]
    image: node:20-alpine
    working_dir: /app
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    depends_on:
      - api
